<!doctype html>

  <head>
    <meta charset="utf-8" />

    <title>Tooni mashin</title>
    <link rel="stylesheet" href=" tooni mashin.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <div class="h-[700px] w-[500px] bg-blue-100 p-4">
      <div

        class="w-full h-20 rounded-md bg-gray-400 text-4xl text-end"
      ></div>
      <div class="flex w-full gap-4 mt-12">
        <div
          class="grid grid-cols-3 grid-rows-3 gap-4 w-2/3 flex gap-2 flex- wrap"
        >
          <button
            onclick="getnumber(1)"
            class="w-20 h-20 bg-white rounded-md text-4xl"
          >
            1
          </button>
          <button
            onclick="getnumber(2)"
            class="w-20 h-20 bg-white rounded-md text-4xl"
          >
            2
          </button>
          <button
            onclick="getnumber(3)"
            class="w-20 h-20 bg-white rounded-md text-4xl"
          >
            3
          </button>
          <button
            onclick="getnumber(4)"
            class="w-20 h-20 bg-white rounded-md text-4xl"
          >
            4
          </button>
          <button
            onclick="getnumber(5)"
            class="w-20 h-20 bg-white rounded-md text-4xl"
          >
            5
          </button>
          <button
            onclick="getnumber(6)"
            class="w-20 h-20 bg-white rounded-md text-4xl"
          >
            6
          </button>
          <button
            onclick="getnumber(7)"

            onclick="getnumber(8)"

            8
          </button>
          <button
            onclick="getnumber(9)"
            class="w-20 h-20 bg-white rounded-md text-4xl"
          >
            9
          </button>
          <button
            onclick="getnumber(tseg)"
            class="w-20 h-20 bg-white rounded-md text-4xl"
          >
            .
          </button>
          <button
            onclick="getnumber(0)"
            class="w-20 h-20 bg-white rounded-md text-4xl"
          >
            0
          </button>
          <button
            onclick="getnumber()"
            class="w-20 h-20 bg-white rounded-md text-4xl place-items-center"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-delete preview-icon"
            >
              <path
                d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"
              />
              <path d="m12 9 6 6" />
              <path d="m18 9-6 6" />
            </svg>
          </button>
          <div class="w-1/3 gap-2 flex flex-col">
            <button
              onclick="getnumber('nemeh')"
              class="w-20 h-15 bg-white rounded-md text-4xl"
            >
              +
            </button>

            <button
              onclick="getnumber('hasah')"
              class="w-20 h-15 bg-white rounded-md text-4xl"
            >
              -
            </button>
            <button
              class="w-20 h-15 bg-white rounded-md text-4xl place-items-center"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-x preview-icon"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
            <button
              class="w-20 h-15 bg-white rounded-md text-4xl place-items-center"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-divide preview-icon"
              >
                <circle cx="12" cy="6" r="1" />
                <line x1="5" x2="19" y1="12" y2="12" />
                <circle cx="12" cy="18" r="1" />
              </svg>
            </button>
            <button
              onclick="showHariu()"
              class="w-20 h-15 bg-white rounded-md text-4xl"
            >
              =
            </button>
          </div>

    <script src="tooni mashin.js
    "></script>
